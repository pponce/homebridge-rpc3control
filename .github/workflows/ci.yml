name: Validate plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - id: install
        run: node scripts/ci-command.mjs npm install
      - name: "Install/build result: ${{ steps.install.outputs.result }}"
        if: always()
        run: echo "Installation/build status recorded above."
      - run: npm run lint
      - run: npm test
      - run: npm pack
      - run: node scripts/check-package.mjs
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: rpc3control-package
          path: homebridge-rpc3control-*.tgz
