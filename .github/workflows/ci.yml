name: Validate plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - id: install
        run: node scripts/ci-command.mjs npm install
      - name: "Install/build result: ${{ steps.install.outputs.result }}"
        if: always()
        run: echo "Installation/build status recorded above."
      - run: npm run lint
      - id: tests
        run: node scripts/ci-command.mjs npm test
      - name: "Test result: ${{ steps.tests.outputs.result }}"
        if: always()
        run: echo "Test status recorded above."
      - if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - id: ui
        if: matrix.node == 24
        run: node scripts/ci-command.mjs npm run test:ui
      - name: "Browser result: ${{ steps.ui.outputs.result }}"
        if: always() && matrix.node == 24
        run: echo "Browser test status recorded above."
      - uses: actions/upload-artifact@v7
        if: always() && matrix.node == 24
        with:
          name: settings-ui-screenshots
          path: test-results/*.png
      - run: npm pack
      - run: node scripts/check-package.mjs
      - uses: actions/upload-artifact@v7
        if: matrix.node == 24
        with:
          name: rpc3control-package
          path: homebridge-rpc3control-*.tgz
